    <!-- APP -->
    <script type="module">

        import {
            ESPLoader,
            Transport
        } from "https://unpkg.com/esptool-js@0.6.0/bundle.js";

        let transport;
        let esploader;
        let firmwareData = []; // Lưu trữ dữ liệu firmware
        const PROJECTS_DIR = "firmware";
        const PROJECT_MANIFEST = "project.json";
        const GITHUB_REPOSITORY = ""; // Điền "owner/repo" nếu dùng custom domain
        const GITHUB_BRANCH = ""; // Điền nhánh Pages nếu không dùng nhánh mặc định

        const logConsole =
            document.getElementById("logConsole");

        function log(message) {

            console.log(message);

            const div =
                document.createElement("div");

            div.innerText =
                "> " + message;

            logConsole.appendChild(div);

            logConsole.scrollTop =
                logConsole.scrollHeight;
        }

        function freshUrl(url) {
            if (!url ||
                url.startsWith("data:") ||
                url.startsWith("blob:")) {
                return url;
            }

            const fresh =
                new URL(url, window.location.href);

            fresh.searchParams.set("_", Date.now().toString());

            return fresh.href;
        }

        function fetchFresh(url, options = {}) {
            return fetch(freshUrl(url), {
                cache: "no-store",
                ...options
            });
        }

        // Browser check
        if (!("serial" in navigator)) {

            alert(
                "Browser không hỗ trợ Web Serial.\nDùng Chrome hoặc Edge."
            );
        }

        function getGithubRepository() {
            if (GITHUB_REPOSITORY) {
                return GITHUB_REPOSITORY;
            }

            const host =
                window.location.hostname.toLowerCase();

            if (!host.endsWith(".github.io")) {
                return "";
            }

            const owner =
                host.replace(".github.io", "");

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(Boolean);

            const repo =
                pathParts[0] || owner + ".github.io";

            return owner + "/" + repo;
        }

        function resolveProjectAsset(assetPath, projectPath) {
            if (!assetPath) {
                return "";
            }

            if (/^(https?:)?\/\//i.test(assetPath) ||
                assetPath.startsWith("data:") ||
                assetPath.startsWith("blob:")) {
                return assetPath;
            }

            const projectUrl =
                new URL(projectPath + "/", window.location.href);

            return new URL(assetPath, projectUrl).href;
        }

        // Chuẩn hoá firmware về dạng có "versions".
        // - project.json mới: có "versions": [{ version, files, ... }]
        // - project.json cũ / firmware.json cũ: chỉ có "version" + "files" -> tự gói thành 1 version
        function ensureVersions(project) {
            const versions =
                (Array.isArray(project.versions) && project.versions.length
                    ? project.versions
                    : [{
                        version: project.version || "1.0.0",
                        files: project.files || []
                    }]
                ).map((v) => ({
                    ...v,
                    version: String(v.version ?? "1.0.0"),
                    files: v.files || []
                }));

            const latest =
                versions.some((v) => v.version === String(project.latest))
                    ? String(project.latest)
                    : versions[0].version;

            return { ...project, versions, latest };
        }

        function normalizeProject(project, projectPath) {
            const withVersions = ensureVersions(project);

            return {
                ...withVersions,
                guide:
                    resolveProjectAsset(withVersions.guide, projectPath),
                versions:
                    withVersions.versions.map((v) => ({
                        ...v,
                        files:
                            v.files.map((file) => ({
                                ...file,
                                path:
                                    resolveProjectAsset(file.path, projectPath)
                            }))
                    }))
            };
        }

        async function loadProjectManifest(projectPath) {
            const response =
                await fetchFresh(projectPath + "/" + PROJECT_MANIFEST);

            if (response.status === 404) {
                return null;
            }

            if (!response.ok) {
                throw new Error(
                    "Không tải được " + projectPath + "/" + PROJECT_MANIFEST
                );
            }

            const project =
                await response.json();

            return normalizeProject(project, projectPath);
        }

        async function discoverFirmwareProjects() {
            const repository =
                getGithubRepository();

            if (!repository) {
                log("Không chạy trên GitHub Pages, dùng firmware.json");
                return [];
            }

            log("Đang tự quét thư mục " + PROJECTS_DIR);

            const apiUrl =
                "https://api.github.com/repos/" +
                repository +
                "/contents/" +
                PROJECTS_DIR +
                (GITHUB_BRANCH
                    ? "?ref=" + encodeURIComponent(GITHUB_BRANCH)
                    : "");

            const response =
                await fetchFresh(apiUrl, {
                    headers: {
                        Accept: "application/vnd.github+json"
                    }
                });

            if (!response.ok) {
                throw new Error(
                    "GitHub API trả về " + response.status
                );
            }

            const entries =
                await response.json();

            const projectDirs =
                entries
                    .filter((entry) =>
                        entry.type === "dir" &&
                        !entry.name.startsWith("_") &&
                        !entry.name.startsWith(".")
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    );

            const projects =
                await Promise.all(
                    projectDirs.map((dir) =>
                        loadProjectManifest(
                            PROJECTS_DIR + "/" + dir.name
                        )
                    )
                );

            return projects.filter(Boolean);
        }

        async function loadFirmwareJson() {
            log("Đang tải firmware.json");

            const response =
                await fetchFresh("./firmware.json");

            if (!response.ok) {
                throw new Error("Không tìm thấy firmware.json");
            }

            const list = await response.json();

            // Đường dẫn trong firmware.json đã tính từ thư mục gốc nên chỉ cần chuẩn hoá versions
            return list.map(ensureVersions);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderFirmwares() {
            const container =
                document.getElementById("firmwareList");

            container.innerHTML = "";

            firmwareData.forEach((fw, index) => {
                const card =
                    document.createElement("div");

                const guideButton = fw.guide ? `
                    <button
                        class="border border-slate-700 hover:bg-slate-800 px-4 rounded-xl"
                        onclick="loadGuideByIndex(${index})">

                        <i data-lucide="book-open"></i>

                    </button>
                ` : "";

                const versionControl =
                    fw.versions.length > 1 ? `
                        <select id="ver-${index}"
                            class="bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-lg px-2 py-1 focus:outline-none">
                            ${fw.versions.map((v) => `
                                <option value="${escapeHtml(v.version)}"
                                    ${v.version === fw.latest ? "selected" : ""}>
                                    v${escapeHtml(v.version)}${v.version === fw.latest ? " (mới nhất)" : ""}
                                </option>
                            `).join("")}
                        </select>
                    ` : `
                        <span id="ver-${index}" data-version="${escapeHtml(fw.versions[0].version)}"
                            class="text-slate-400 text-sm">
                            v${escapeHtml(fw.versions[0].version)}
                        </span>
                    `;

                card.className =
                    "glass border border-slate-800 rounded-2xl p-5 transition-all card-hover";

                card.innerHTML = `

                    <div class="flex justify-between mb-4">

                        <span class="bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full text-xs font-bold">
                            ${escapeHtml(fw.chip)}
                        </span>

                        ${versionControl}

                    </div>

                    <h3 class="text-xl font-bold mb-3">
                        ${escapeHtml(fw.name)}
                    </h3>

                    <p class="text-slate-400 text-sm mb-2">
                        ${escapeHtml(fw.description)}
                    </p>

                    <p id="notes-${index}" class="text-slate-500 text-xs mb-6 min-h-[1rem]">
                        ${escapeHtml(
                            (fw.versions.find((v) => v.version === fw.latest) || {}).notes || ""
                        )}
                    </p>

                    <div class="flex gap-3">

                        <button
                            class="flex-1 bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-semibold transition-all"
                            onclick="flashFirmwareByIndex(${index})">

                            Flash

                        </button>

                        ${guideButton}

                    </div>
                `;

                container.appendChild(card);
            });

            firmwareData.forEach((fw, index) => {
                const select = document.getElementById("ver-" + index);

                if (select && select.tagName === "SELECT") {
                    select.addEventListener("change", () => {
                        const v = fw.versions.find((x) => x.version === select.value);
                        document.getElementById("notes-" + index).innerText =
                            (v && v.notes) || "";
                        log("Đã chọn " + fw.name + " v" + select.value +
                            " (" + (v ? v.files.length : 0) + " file)");
                    });
                }
            });

            lucide.createIcons();
        }

        // LOAD FIRMWARE LIST
        async function loadFirmwares() {
            try {
                let discoveredProjects = [];

                try {
                    discoveredProjects =
                        await discoverFirmwareProjects();
                } catch (discoverError) {
                    console.warn(discoverError);
                    log(
                        "Không tự quét được thư mục firmware: " +
                        discoverError.message
                    );
                }

                firmwareData =
                    discoveredProjects;

                if (!firmwareData.length) {
                    firmwareData =
                        await loadFirmwareJson();
                }

                log("Đã tải " + firmwareData.length + " firmware (" +
                    firmwareData.reduce((n, f) => n + f.versions.length, 0) +
                    " version)");
                renderFirmwares();

            } catch (e) {

                console.error(e);

                log("Lỗi tải danh sách firmware: " + e.message);

                document.getElementById(
                    "firmwareList"
                ).innerHTML = `
                    <div class="glass rounded-2xl border border-red-500 p-5 text-red-400">
                        Không thể tải danh sách firmware
                    </div>
                `;
            }
        }

        // CONNECT
        document.getElementById("btnConnect")
        .onclick = async () => {

            try {

                log("Đang yêu cầu chọn COM...");

                const port =
                    await navigator.serial.requestPort();

                transport =
                    new Transport(port);

                esploader =
                    new ESPLoader({

                        transport: transport,

                        baudrate: 115200
                    });

                log("Đang kết nối ESP...");

                const chip =
                    await esploader.main();

                const chipName =
                    chip ||
                    esploader.chip?.CHIP_NAME ||
                    "ESP";

                document.getElementById(
                    "chipName"
                ).innerText = chipName;

                document.getElementById(
                    "connectState"
                ).innerText =
                    "Đã kết nối";

                document.getElementById(
                    "connectState"
                ).className =
                    "text-green-400";

                log("Kết nối thành công!");
                log("Chip: " + chipName);

            } catch (e) {

                console.error(e);

                log("Lỗi kết nối: " + e.message);

                alert("Không thể kết nối ESP!");
            }
        };



        // FLASH
        window.flashFirmwareByIndex = async (index) => {
            if (!esploader) {
                alert("Vui lòng kết nối ESP trước!");
                return;
            }

            const fw = firmwareData[index];
            if (!fw) return;

            const verEl = document.getElementById("ver-" + index);
            const selected =
                (verEl && (verEl.value || verEl.dataset.version)) || fw.latest;

            const ver =
                fw.versions.find((v) => v.version === selected);

            if (!ver || !Array.isArray(ver.files) || !ver.files.length) {
                alert("Version này chưa khai báo file để flash!");
                return;
            }

            log("Chọn " + fw.name + " v" + ver.version);

            // Tuỳ chọn flash: version ghi đè firmware (vd eraseAll riêng cho từng version)
            await flashFiles({ ...fw, ...ver, files: ver.files });
        };

        async function shortHash(buffer) {
            try {
                const digest =
                    await crypto.subtle.digest("SHA-256", buffer);

                return Array.from(new Uint8Array(digest))
                    .slice(0, 4)
                    .map((b) => b.toString(16).padStart(2, "0"))
                    .join("");
            } catch (e) {
                return "n/a";
            }
        }

        // Ngắt kết nối sau khi flash: chip đã hard_reset nên phiên esptool cũ không còn ở bootloader.
        async function resetConnection() {
            try {
                if (transport) {
                    await transport.disconnect();
                }
            } catch (e) {
                console.warn(e);
            }

            transport = null;
            esploader = null;

            document.getElementById("chipName").innerText = "-";

            const state = document.getElementById("connectState");
            state.innerText = "Chưa kết nối";
            state.className = "text-red-400";

            log("Đã ngắt kết nối. Bấm 'Kết nối ESP' để nạp tiếp.");
        }

        async function flashFiles(fw) {
            const modal =
                document.getElementById(
                    "progressModal"
                );

            const progressBar =
                document.getElementById(
                    "progressBar"
                );

            const progressText =
                document.getElementById(
                    "progressPercent"
                );

            modal.classList.remove("hidden");

            modal.classList.add("flex");

            try {
                const files =
                    fw.files || [];

                let flashFiles = [];

                for (const file of files) {
                    log("Đang tải " + file.path);
                    const response = await fetchFresh(file.path);

                    if (!response.ok) {

                        throw new Error("Không tải được " + file.path);
                    }

                    const content =
                        await response.arrayBuffer();

                    log("  " + file.offset + " <- " +
                        file.path.split("?")[0].split("/").slice(-2).join("/") +
                        " (" + content.byteLength + " B, sha256 " +
                        await shortHash(content) + ")");

                    flashFiles.push({

                        data:
                            new Uint8Array(content),

                        address:
                            parseInt(file.offset)
                    });
                }

                log("Đang flash firmware...");

                await esploader.writeFlash({
                    fileArray:
                        flashFiles,

                    flashMode:
                        fw.flashMode || "keep",

                    flashFreq:
                        fw.flashFreq || "keep",

                    flashSize:
                        fw.flashSize || "keep",

                    eraseAll:
                        fw.eraseAll !== false,

                    compress:
                        fw.compress !== false,

                    reportProgress:
                        (fileIndex,
                         written,
                         total) => {

                        const percent =
                            Math.floor(
                                written / total * 100
                            );

                        progressBar.style.width =
                            percent + "%";

                        progressText.innerText =
                            percent + "%";
                    }
                });

                log("Flash thành công!");

                await esploader.after("hard_reset");
                log("Đã nạp xong " + fw.name + " v" + fw.version);
                await resetConnection();
                alert("Nạp firmware thành công!\nMuốn nạp tiếp, bấm 'Kết nối ESP' lại.");

            } catch (e) {
                console.error(e);
                log("Lỗi flash: " + e.message);
                alert("Flash thất bại!");
            } finally {
                modal.classList.remove("flex");
                modal.classList.add("hidden");
            }
        }

        // GUIDE (cửa sổ nổi)
        const guideModal =
            document.getElementById("guideModal");

        const guideBody =
            document.getElementById("guideBody");

        const guideTitle =
            document.getElementById("guideTitle");

        function resolveUrl(value, baseUrl) {
            try {
                return new URL(value, baseUrl).href;
            } catch (e) {
                return value;
            }
        }

        // Ảnh dạng github.com/.../blob/... chỉ trả về trang HTML, đổi sang raw để hiển thị được
        function toRawGithubUrl(href) {
            try {
                const url = new URL(href);

                if (url.hostname === "github.com") {
                    const parts = url.pathname.split("/").filter(Boolean);

                    if (parts.length > 4 && parts[2] === "blob") {
                        return "https://raw.githubusercontent.com/" +
                            parts[0] + "/" + parts[1] + "/" +
                            parts.slice(3).join("/").replace(/^blob\//, "");
                    }
                }
            } catch (e) {
                // bỏ qua, dùng URL gốc
            }

            return href;
        }

        // Loại bỏ thẻ/thuộc tính nguy hiểm trong HTML sinh ra từ markdown
        function sanitizeGuide(root) {
            root.querySelectorAll(
                "script,iframe,object,embed,style,link,meta,form"
            ).forEach((el) => el.remove());

            root.querySelectorAll("*").forEach((el) => {
                Array.from(el.attributes).forEach((attr) => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim().toLowerCase();

                    if (name.startsWith("on") ||
                        ((name === "href" ||
                          name === "src" ||
                          name === "xlink:href") &&
                         value.startsWith("javascript:"))) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
        }

        // Đường dẫn tương đối trong README phải tính từ thư mục chứa README,
        // không phải từ index.html -> đây là lý do ảnh không hiển thị trước đây
        function resolveGuideAssets(root, baseUrl) {
            root.querySelectorAll("img").forEach((img) => {
                const src = img.getAttribute("src");

                if (src) {
                    img.setAttribute(
                        "src",
                        toRawGithubUrl(resolveUrl(src, baseUrl))
                    );
                }

                img.setAttribute("loading", "lazy");
            });

            root.querySelectorAll("a[href]").forEach((a) => {
                const href = a.getAttribute("href");

                if (href.startsWith("#")) {
                    return;
                }

                a.setAttribute("href", resolveUrl(href, baseUrl));
                a.setAttribute("target", "_blank");
                a.setAttribute("rel", "noopener noreferrer");
            });
        }

        function escapeSelector(id) {
            return (window.CSS && CSS.escape)
                ? CSS.escape(id)
                : id.replace(/[^\w-]/g, "\\$&");
        }

        function openGuideModal(title) {
            guideTitle.textContent = title || "Hướng dẫn";

            guideModal.classList.remove("hidden");
            guideModal.classList.add("flex");

            document.body.style.overflow = "hidden";
            guideBody.scrollTop = 0;
        }

        window.closeGuide = () => {
            guideModal.classList.remove("flex");
            guideModal.classList.add("hidden");

            document.body.style.overflow = "";
            guideBody.innerHTML = "";
        };

        // Nút X, bấm ra ngoài khung hoặc nhấn Esc để đóng
        document.getElementById("guideClose")
            .addEventListener("click", () => window.closeGuide());

        guideModal.addEventListener("click", (e) => {
            if (e.target === guideModal) {
                window.closeGuide();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" &&
                !guideModal.classList.contains("hidden")) {
                window.closeGuide();
            }
        });

        // Link nội bộ dạng #muc-luc cuộn trong cửa sổ, không điều hướng trang
        guideBody.addEventListener("click", (e) => {
            const link =
                e.target.closest && e.target.closest('a[href^="#"]');

            if (!link) {
                return;
            }

            e.preventDefault();

            let id = link.getAttribute("href").slice(1);

            try {
                id = decodeURIComponent(id);
            } catch (err) {
                // giữ nguyên id
            }

            const target =
                id && guideBody.querySelector("#" + escapeSelector(id));

            if (target && target.scrollIntoView) {
                target.scrollIntoView({ behavior: "smooth" });
            }
        });

        window.loadGuideByIndex = async (index) => {
            const fw = firmwareData[index];

            if (!fw || !fw.guide) {
                return;
            }

            await window.loadGuide(fw.guide, fw.name);
        };

        window.loadGuide =
            async (guidePath, title) => {

            openGuideModal(title);

            guideBody.innerHTML =
                '<div class="text-slate-400">Đang tải hướng dẫn...</div>';

            try {

                log("Đang tải hướng dẫn: " + guidePath);

                const response =
                    await fetchFresh(guidePath);

                if (!response.ok) {

                    throw new Error("Không tìm thấy file hướng dẫn");
                }

                const markdown =
                    await response.text();

                const baseUrl =
                    new URL(guidePath, window.location.href).href;

                const container =
                    document.createElement("div");

                container.innerHTML =
                    marked.parse(markdown);

                sanitizeGuide(container);
                resolveGuideAssets(container, baseUrl);

                guideBody.innerHTML = "";
                guideBody.appendChild(container);
                guideBody.scrollTop = 0;

                log("Đã tải hướng dẫn");

            } catch (e) {

                console.error(e);

                log("Không thể tải hướng dẫn: " + e.message);

                guideBody.innerHTML =
                    '<div class="text-red-400">Không tải được hướng dẫn</div>';
            }
        };

        // INIT
        loadFirmwares();

        lucide.createIcons();

    </script>

</body>

</html>
